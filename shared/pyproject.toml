[project]
name = "platform-shared"
version = "0.1.0"
description = "Shared utilities for AWS SageMaker data platform"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["platform_shared*"]

